{% extends 'brgy/base_auth.html' %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="auth-page" style="align-items:center;justify-content:center;">
    <div style="text-align:center;max-width:440px;padding:24px;">
        <div style="width:80px;height:80px;border-radius:50%;background:var(--danger-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;">
            <i class="fa-solid fa-lock" style="font-size:32px;color:var(--danger);"></i>
        </div>
        <h1 style="font-size:48px;font-weight:800;color:var(--text);line-height:1;">403</h1>
        <h2 style="font-size:20px;font-weight:700;color:var(--text);margin:12px 0 8px;">Access Denied</h2>
        <p style="color:var(--text-secondary);font-size:15px;margin-bottom:28px;">
            You do not have permission to access this page. If you believe this is an error, please contact your administrator.
        </p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary">
            <i class="fa-solid fa-house"></i> Go to Dashboard
        </a>
    </div>
</div>
{% endblock %}
